name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/unit -q

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB with Atlas Search and Vector Search
        run: docker run -d --name mongodb -p 27017:27017 mongodb/mongodb-atlas-local:latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Wait for MongoDB
        run: |
          python - <<'EOF'
          import time
          from pymongo import MongoClient
          for _ in range(90):
              try:
                  MongoClient("mongodb://localhost:27017/?directConnection=true",
                              serverSelectionTimeoutMS=2000).admin.command("ping")
                  print("MongoDB is up"); break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("MongoDB never came up")
          EOF
      - name: Integration tests and red-team leak eval
        env:
          LEAK_EVAL_REPORT: leak_eval.json
        run: pytest tests/integration -v -s
      - name: Leak eval summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          if not os.path.exists("leak_eval.json"):
              print("Leak eval did not run."); raise SystemExit
          r = json.load(open("leak_eval.json"))
          print("## Red-team leak eval")
          print(f"- **{r['attacks']} attacks** x {len(r['roles'])} roles = {r['requests']} requests")
          print(f"- **Leaks: {r['leaks']}**")
          print(f"- /ask latency (retrieval + access filter, no LLM): p50 {r['ask_latency_ms']['p50']} ms, "
                f"p95 {r['ask_latency_ms']['p95']} ms")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leak-eval
          path: backend/leak_eval.json
          if-no-files-found: ignore
      - name: MongoDB logs on failure
        if: failure()
        run: docker logs mongodb | tail -100

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCKS: "true"
